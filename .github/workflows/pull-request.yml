name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-check:
    name: Pull Request Check
    runs-on: self-hosted
    timeout-minutes: 20

    concurrency:
      group: pr-${{ github.ref }}
      cancel-in-progress: true

    env:
      FLUTTER_VERSION: "3.41.6"
      PREINSTALLED_FLUTTER_ROOT: /home/ncladr/actions-runner/chatkuy/_work/_tool/flutter/stable-3.41.6-x64/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use preinstalled Flutter
        run: |
          if [ ! -x "$PREINSTALLED_FLUTTER_ROOT/bin/flutter" ]; then
            echo "::error::Flutter $FLUTTER_VERSION not found at $PREINSTALLED_FLUTTER_ROOT"
            ls -la "$(dirname "$PREINSTALLED_FLUTTER_ROOT")" || true
            exit 1
          fi

          echo "FLUTTER_ROOT=$PREINSTALLED_FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "$PREINSTALLED_FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$PREINSTALLED_FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          "$PREINSTALLED_FLUTTER_ROOT/bin/flutter" --version

      - name: Cache build runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-runner-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml') }}-
            ${{ runner.os }}-build-runner-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --no-pub

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Lint Firebase Functions
        working-directory: functions
        run: npm run lint

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Firebase Emulator ports
        shell: bash
        run: |
          port_base=$((20000 + (GITHUB_RUN_ID % 4000) * 5))
          firebase_ci_config="$RUNNER_TEMP/firebase-ci.json"

          export FIRESTORE_PORT="$port_base"
          export STORAGE_PORT=$((port_base + 1))
          export HUB_PORT=$((port_base + 2))
          export LOGGING_PORT=$((port_base + 3))
          export FIRESTORE_WEBSOCKET_PORT=$((port_base + 4))
          export FIREBASE_CI_CONFIG="$firebase_ci_config"

          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const config = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            config.firestore = config.firestore.map((database) => ({
              ...database,
              rules: path.resolve(database.rules),
              indexes: path.resolve(database.indexes)
            }));
            config.storage.rules = path.resolve(config.storage.rules);
            config.emulators = {
              firestore: {
                host: "127.0.0.1",
                port: Number(process.env.FIRESTORE_PORT),
                websocketPort: Number(process.env.FIRESTORE_WEBSOCKET_PORT)
              },
              storage: {host: "127.0.0.1", port: Number(process.env.STORAGE_PORT)},
              hub: {host: "127.0.0.1", port: Number(process.env.HUB_PORT)},
              logging: {host: "127.0.0.1", port: Number(process.env.LOGGING_PORT)},
              ui: {enabled: false}
            };
            fs.writeFileSync(process.env.FIREBASE_CI_CONFIG, JSON.stringify(config));
          '

          echo "FIREBASE_CI_CONFIG=$firebase_ci_config" >> "$GITHUB_ENV"

      - name: Test Firestore and Storage rules
        run: |
          firebase emulators:exec \
            --config "$FIREBASE_CI_CONFIG" \
            --project demo-chatkuy \
            --only firestore,storage \
            --log-verbosity QUIET \
            "npm --prefix functions run test:rules"
